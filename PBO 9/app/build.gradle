plugins {
    id 'application'
    id 'org.openjfx.javafxplugin' version '0.1.0'
}

repositories {
    mavenCentral()
}

dependencies {
    // Kosong untuk saat ini
}

javafx {
    version = "17.0.2"
    modules = [ 'javafx.controls', 'javafx.graphics' ]
}

application {
    mainClass = 'com.savio.MainApp'
}

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}